name: preview-db

# UTA-11: per-PR Neon preview branches + Vercel preview DATABASE_URL wiring.
#
# - PR opened / synchronize / reopened → setup: find-or-create
#   `preview/pr-<n>` as a child of Staging, migrate + synthetic-seed it, and
#   scope its DATABASE_URL to the PR's git branch in Vercel.
# - PR closed → cleanup: delete the Neon branch + the branch-scoped env.
# - Nightly → reconcile: delete stranded branches (TTL / PR-closed).
#
# Failures fail the workflow visibly; re-running is safe (idempotent).
# Connection strings never appear in logs — only redacted hostnames.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: '17 3 * * *' # nightly reconcile (UTC)
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to set up, clean, or reconcile'
        required: false
        default: ''
      mode:
        description: 'setup | cleanup | reconcile | reconcile-dry-run'
        required: false
        default: 'reconcile-dry-run'

permissions:
  contents: read
  pull-requests: read

jobs:
  setup:
    name: preview setup (Neon branch + migrate + seed + Vercel wiring)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: preview
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_BRANCH: ${{ github.head_ref }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_PRODUCTION_BRANCH_ID: ${{ secrets.NEON_PRODUCTION_BRANCH_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create preview branch, migrate, seed, wire Vercel
        id: preview
        run: pnpm --filter @tokoboss/neon-preview preview:setup
      - name: Summary (redacted)
        if: always()
        run: |
          echo "### Preview DB setup (UTA-11)" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: #${{ github.event.pull_request.number }} (${{ github.head_ref }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: ${{ steps.preview.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Neon branch / host / Vercel env id are in the step outputs (hosts only, never secrets)." >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: preview cleanup (delete Neon branch + Vercel env)
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_BRANCH: ${{ github.head_ref }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete preview branch + branch env
        run: node infra/neon/preview-cleanup.mjs

  reconcile:
    name: reconcile stranded preview branches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PREVIEW_BRANCH_TTL_HOURS: '72'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile (dry run on manual default)
        run: |
          if [ "${{ inputs.mode }}" = "reconcile" ]; then
            node infra/neon/preview-reconcile.mjs
          elif [ "${{ inputs.mode }}" = "cleanup" ]; then
            PR_NUMBER="${{ inputs.pr_number }}" node infra/neon/preview-cleanup.mjs --dry-run --skip-vercel
          elif [ "${{ inputs.mode }}" = "setup" ]; then
            PR_NUMBER="${{ inputs.pr_number }}" GIT_BRANCH="(manual)" APP_ENV=preview node infra/neon/preview-setup.mjs --dry-run --skip-migrate --skip-vercel
          else
            node infra/neon/preview-reconcile.mjs --dry-run
          fi
