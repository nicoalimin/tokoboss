name: marketplace-tokens-cron

# RFC 04 row 96 (CoS decision 2026-10-23): Vercel Hobby only allows daily
# crons, so GitHub Actions calls the token job every 15 minutes instead.
#
# Required repo settings:
# - secret CRON_SECRET: same value as CRON_SECRET in Vercel Production.
# - variable TOKOBOSS_PROD_URL: production origin, no trailing slash,
#   e.g. https://tokoboss.example.com

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: marketplace-tokens-cron
  cancel-in-progress: false

jobs:
  call:
    name: POST /api/jobs/marketplace-tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call token job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROD_URL: ${{ vars.TOKOBOSS_PROD_URL }}
        run: |
          curl --fail-with-body -sS --max-time 120 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${PROD_URL}/api/jobs/marketplace-tokens"
